<body>
  <div id="app" class="loading">
    <a class="brand" href="#home" aria-label="Crypto Map 首页">
      <svg viewBox="0 0 76 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="6" width="12" height="12" rx="2.5"/><rect x="32" y="6" width="12" height="12" rx="2.5"/><rect x="62" y="6" width="12" height="12" rx="2.5"/><path d="M14 12h18M44 12h18"/></g></svg>
      <span>CRYPTO<b>MAP</b></span>

    <div id="stage">
      <div class="axis" aria-hidden="true"><span class="off">← 链下 · 法币世界</span><span class="on">链上 · 加密世界 →</span></div>
      <div id="bands" aria-hidden="true"></div>
      <canvas id="fx" aria-hidden="true"></canvas>
      <div id="nodes" role="group" aria-label="产业参与者"></div>
      <canvas id="fxTop" aria-hidden="true"></canvas>
      <div id="pop" class="pop panel" hidden></div>
      <div id="hint" class="hint"></div>
    </div>

    <nav id="dock" class="panel dock" aria-label="章节"></nav>

    <aside id="side">
      <div id="controls" class="panel controls"></div>
      <div id="stats" class="stats"></div>
      <div id="story" class="panel story"></div>
      <section id="ledgerCard" class="panel ledger-card" hidden>
        <div class="ledger-head">
          <span class="ledger-title">账本</span>
          <span class="ledger-meta" id="ledgerMeta"></span>
        </div>
        <div class="ledger-list" id="ledgerList"></div>
        <div class="ledger-legend" id="ledgerLegend"></div>
      </section>
    </aside>

    <div id="loader" class="loader">
      <svg viewBox="0 0 200 40"><g class="blocks" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="10" y="12" width="16" height="16" rx="3"/><rect x="92" y="12" width="16" height="16" rx="3"/><rect x="174" y="12" width="16" height="16" rx="3"/><path class="beat" d="M26 20h66M108 20h66"/></g></svg>
      <p>正在绘制地图…</p>

  </div>
